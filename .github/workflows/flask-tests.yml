name: Flask API tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-flask-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Flask
        run: python -m pip install -r hackseries-flask/requirements.txt
      - name: Run API tests
        run: python -m unittest discover -s hackseries-flask -p "test_*.py" -v
